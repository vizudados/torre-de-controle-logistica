<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Torre de Controle · Logística · mídias da capa</title><style>body{font-family:'Segoe UI',system-ui,sans-serif;color:#0A2438;background:#EFF4F8;margin:48px;max-width:760px}a{color:#00739F}li{margin:6px 0}small{color:#56718A}</style></head><body><h1>Torre de Controle · Logística · mídias da capa</h1><p>Ativos servidos pelo GitHub Pages para o visual HTML Content de um dashboard Power BI. Ver <a href="assets/manifest.json">manifest.json</a>.</p><ul id="lista"></ul><small>Cenas geradas por IA a partir de roteiro próprio e editadas; sem dados, texto, marca ou pessoas identificáveis.</small><script>fetch('assets/manifest.json').then(r=>r.json()).then(m=>{const ul=document.getElementById('lista');m.arquivos.forEach(a=>{const li=document.createElement('li');const l=document.createElement('a');l.href=a.file;l.textContent=a.file;li.appendChild(l);li.appendChild(document.createTextNode(' · '+Math.round(a.bytes/1024)+' KB'));ul.appendChild(li);});}).catch(()=>{});</script></body></html>
